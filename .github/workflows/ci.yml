name: CI

on:
  push:
    branches: [master, development, 'Improve/**', 'track/**', 'new/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    name: Pint (code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      # .env first: composer scripts boot the app (package:discover), and a
      # fresh checkout has no .env — without one APP_ENV defaults to
      # production and the infrastructure-pin guard fails the install.
      - run: cp .env.example .env && php artisan key:generate --no-interaction
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: ./vendor/bin/pint --test

  js:
    name: Lint, Vitest and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The suite (~1900 tests, each seeding fresh sqlite DBs) takes hours
  # sequentially. It shards by test-class prefix — five disjoint,
  # letter-balanced filters (verified: every class in exactly one shard,
  # new files auto-include by prefix) — each running its shard with
  # paratest --functional across 6 workers. Wall clock drops to the
  # slowest shard (~15 min) instead of the whole suite (~3 h).
  php-tests:
    name: PHPUnit shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1-unit-and-a-g
            filter: '/^Tests\\Unit\\|^Tests\\Feature\\([A-G]|HardeningTest)/'
          - shard: 2-hrms-a-k
            filter: '/^Tests\\Feature\\Hrms[A-K]/'
          - shard: 3-hrms-l-z
            filter: '/^Tests\\Feature\\Hrms[L-Z]/'
          - shard: 4-i-to-s
            filter: '/^Tests\\Feature\\[I-S]/'
          - shard: 5-t-to-z
            filter: '/^Tests\\Feature\\[T-Z]/'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, pdo_pgsql, mbstring, bcmath, zip, gd
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      # Same ordering reason as the pint job: the env file must exist before
      # any composer script boots the app.
      - run: cp .env.example .env && php artisan key:generate
      - run: composer install --no-interaction --no-progress --prefer-dist
      # View-rendering tests hit @vite() Blade directives, and public/build
      # is gitignored — build the real manifest first so tests exercise the
      # production asset path instead of 500ing on a missing manifest.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: vendor/bin/paratest --functional -p6 --filter '${{ matrix.filter }}' tests/
